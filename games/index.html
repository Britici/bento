<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9f5ff">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Cantinho dos Jogos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: cada tela ocupa a página inteira; a área de jogo tem tamanho fixo e nunca muda durante a partida. */
:root {
  --bg: #e9f5ff;
  --ink: #1d2b4a;
  --ink-soft: #55678a;
  --tile: #ffffff;
  --tile-edge: #cfe3f5;
  --star: #5b5ce6;
  --on-star: #ffffff;
  --ball: #12a9a0;
  --on-ball: #052e2b;
  --accent: #ff6b57;
  --accent-ink: #ffffff;
  --win: #fff2c2;
  --paper: #ffffff;
  --sky-a: #b9e3ff;
  --sky-b: #eaf8ff;
  --font: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14203a; --ink: #f1f6ff; --ink-soft: #a9b9d8; --tile: #22325a; --tile-edge: #2f4478;
    --star: #a3a4ff; --on-star: #14203a; --ball: #3fd6cb; --on-ball: #0b2a28; --accent: #ff7f6b; --accent-ink: #1b1020; --win: #3a4a1f;
    --paper: #f4f7ff; --sky-a: #1d3a6b; --sky-b: #14264a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14203a; --ink: #f1f6ff; --ink-soft: #a9b9d8; --tile: #22325a; --tile-edge: #2f4478;
  --star: #a3a4ff; --on-star: #14203a; --ball: #3fd6cb; --on-ball: #0b2a28; --accent: #ff7f6b; --accent-ink: #1b1020; --win: #3a4a1f;
  --paper: #f4f7ff; --sky-a: #1d3a6b; --sky-b: #14264a;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 18px;
  padding-block: 10px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none; overflow: hidden;
}
button { font-family: inherit; touch-action: manipulation; }
#app { height: 100%; max-width: 560px; margin: 0 auto; min-height: 0; }
.screen { height: 100%; display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }
.play-area { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }

/* barra superior */
.topbar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; flex: none; }
.ptitle { text-align: center; font-weight: 700; font-size: 20px; line-height: 1.05; min-width: 0; text-wrap: balance; }
.small-btn {
  font-weight: 600; font-size: 16px; color: var(--ink); background: var(--tile);
  border: 3px solid var(--tile-edge); border-radius: 16px; padding: 8px 14px; cursor: pointer; min-height: 46px;
}
.small-btn[aria-pressed="true"].on { border-color: var(--accent); }

/* central de jogos */
.hub-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex: none; }
.gear { font-size: 26px; line-height: 1; min-width: 56px; min-height: 52px; padding: 4px 10px; flex: none; }
h1 { font-size: clamp(28px, 7.4vw, 40px); line-height: 1.05; margin: 0; font-weight: 700; text-wrap: balance; }
.hub-grid { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(128px, 1fr); gap: 12px; padding: 2px 2px 8px; align-content: stretch; }
.gcard {
  background: var(--tile); border: 3px solid var(--tile-edge); border-bottom-width: 8px; border-radius: 28px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px;
  color: var(--ink); font-weight: 600; font-size: clamp(17px, 4.6vw, 22px); cursor: pointer; min-height: 0; min-width: 0;
  text-align: center; line-height: 1.1;
}
.gcard:active { transform: translateY(3px); border-bottom-width: 5px; }
.gcard svg { width: clamp(44px, 15vw, 78px); height: auto; max-height: 55%; }

/* menu de cada jogo */
.menu-body { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; -webkit-user-select: auto; user-select: auto; }
.menu-inner { margin: auto 0; display: flex; flex-direction: column; gap: 14px; padding: 4px 0; min-width: 0; }
.menu-inner.top { margin: 0; }
.menu-inner h2 { margin: 0; text-align: center; font-size: 34px; line-height: 1.05; }
.menu-inner .desc { margin: 0; text-align: center; color: var(--ink-soft); font-weight: 500; }
.menu-icon { display: grid; place-items: center; }
.menu-icon svg { width: 84px; height: 84px; }
.compact .menu-icon { display: none; }
.label { font-weight: 600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .08em; font-size: 14px; margin-bottom: -6px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  flex: 1 1 28%; font-weight: 600; font-size: 18px; color: var(--ink); background: var(--tile);
  border: 3px solid var(--tile-edge); border-radius: 18px; padding: 12px 6px; cursor: pointer; min-height: 52px;
}
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.big {
  font-weight: 600; font-size: 22px; color: var(--ink); background: var(--tile);
  border: 3px solid var(--tile-edge); border-bottom-width: 7px; border-radius: 26px; padding: 16px 18px;
  display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; text-align: center; width: 100%;
}
.big:active { transform: translateY(3px); border-bottom-width: 4px; }
.big small { display: block; font-size: 15px; font-weight: 400; color: var(--ink-soft); }
.big.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; border-bottom-color: rgba(0,0,0,.2); }
.big.primary small { color: inherit; opacity: .85; }
.actions { display: flex; flex-direction: column; gap: 12px; }
.sel {
  font: inherit; font-size: 17px; color: var(--ink); background: var(--tile); width: 100%;
  border: 3px solid var(--tile-edge); border-radius: 16px; padding: 12px; min-height: 52px;
}
.tip { margin: 0; color: var(--ink-soft); font-size: 15px; line-height: 1.35; font-weight: 400; }

/* busca de desenhos */
.extra { display: flex; flex-direction: column; gap: 8px; }
.extra .label, .extra .hint { margin: 0; }
.searchrow { display: flex; gap: 8px; }
.inp {
  flex: 1; min-width: 0; font: inherit; font-size: 18px; color: var(--ink); background: var(--tile);
  border: 3px solid var(--tile-edge); border-radius: 16px; padding: 10px 14px; min-height: 52px;
  -webkit-user-select: text; user-select: text;
}
.hint { min-height: 20px; color: var(--ink-soft); font-size: 15px; font-weight: 500; margin: -4px 0 -4px; }
.thumbs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; max-height: 32vh; overflow-y: auto; padding: 2px; }
.thumb {
  background: var(--tile); border: 3px solid var(--tile-edge); border-radius: 16px; padding: 4px 2px 5px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ink); font-size: 12px; font-weight: 600; min-width: 0;
}
.thumb svg { width: 100%; height: auto; display: block; border-radius: 10px; }
.thumb .reg { stroke-width: 2.2; }
.thumb[aria-pressed="true"] { border-color: var(--accent); background: var(--win); }
@media (max-width: 380px) { .thumbs { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* partes comuns dos jogos */
.status {
  flex: none; min-height: 56px; display: flex; align-items: center; justify-content: center; gap: 12px;
  font-size: 26px; font-weight: 700; text-align: center; line-height: 1.1;
}
.status svg { width: 42px; height: 42px; flex: none; }
.status.small { font-size: 22px; }
.stage { flex: 1; min-height: 0; container-type: size; display: grid; place-items: center; }
.square { width: min(100cqw, 100cqh); height: min(100cqw, 100cqh); }
.bottom { flex: none; min-height: 76px; display: flex; flex-direction: column; justify-content: center; }
.bottom[data-show="false"] .big { visibility: hidden; pointer-events: none; }
.focusable:focus-visible, button:focus-visible, .inp:focus-visible, .sel:focus-visible { outline: 4px solid var(--accent); outline-offset: 2px; }

/* placar */
.scores { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.score {
  background: var(--tile); border: 3px solid var(--tile-edge); border-radius: 20px; height: 56px;
  display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700; font-size: 28px;
  font-variant-numeric: tabular-nums;
}
.score svg { width: 32px; height: 32px; }
.score[data-on="true"] { border-color: var(--accent); }
.pbadge { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; font-weight: 700; flex: none; }
.pbadge.p1 { background: var(--star); color: var(--on-star); }
.pbadge.p2 { background: var(--ball); color: var(--on-ball); }

/* jogo da velha */
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; height: 100%; }
.cell {
  background: var(--tile); border: 3px solid var(--tile-edge); border-bottom-width: 7px; border-radius: 24px;
  padding: 12%; cursor: pointer; min-width: 0; min-height: 0; overflow: hidden; color: inherit; position: relative;
}
.cell:disabled { cursor: default; }
.cell:not(:disabled):active { transform: translateY(3px); }
.cell svg { position: absolute; inset: 12%; width: 76%; height: 76%; display: block; }
.cell.pop svg { animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
.cell.win { background: var(--win); border-color: var(--accent); }
.cell.win svg { animation: bounce .7s ease-in-out infinite alternate; }
@keyframes pop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes bounce { from { transform: scale(1) rotate(-6deg); } to { transform: scale(1.14) rotate(6deg); } }

/* memória */
.mgrid { display: grid; gap: 8px; width: 100cqw; height: 100cqh; }
.mcard { container-type: size; position: relative; background: none; border: 0; padding: 0; min-width: 0; min-height: 0; cursor: pointer; perspective: 700px; }
.mcard .inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .4s; }
.mcard.open .inner { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; display: grid; place-items: center; border-radius: 22px;
  -webkit-backface-visibility: hidden; backface-visibility: hidden; font-size: 50cqmin; font-weight: 700;
}
.face.back { background: var(--accent); color: var(--accent-ink); border: 3px solid transparent; border-bottom: 7px solid rgba(0,0,0,.2); }
.face.front { background: var(--tile); border: 3px solid var(--tile-edge); transform: rotateY(180deg); }
.mcard.ok .face.front { background: var(--win); border-color: var(--accent); }

/* contar */
.items { display: grid; width: 100cqw; height: 100cqh; }
.it { font-size: inherit; display: grid; place-items: center; background: none; border: 0; padding: 0; cursor: pointer; position: relative; line-height: 1; min-width: 0; min-height: 0; color: inherit; }
.it.cnt { opacity: .55; }
.it.cnt::after {
  content: attr(data-n); position: absolute; right: 6%; bottom: 6%; min-width: 1.5em; height: 1.5em; padding: 0 .25em; border-radius: 1em;
  background: var(--accent); color: var(--accent-ink); font-size: .3em; font-weight: 700; display: grid; place-items: center; font-family: var(--font);
}
.choices { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; min-height: 84px; }
.num { font-size: 40px; font-weight: 700; color: var(--ink); background: var(--tile); border: 3px solid var(--tile-edge); border-bottom-width: 7px; border-radius: 24px; cursor: pointer; }
.num:active { transform: translateY(3px); }
.num.right { background: #22c55e; color: #fff; border-color: transparent; }
.num.wrong { opacity: .35; animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* siga as cores (estilo Simon) */
.simon { position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #0f1220; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 3.2%; container-type: size; border: 6px solid #0f1220; box-shadow: 0 6px 0 rgba(0,0,0,.25); }
.spad { border: 0; padding: 0; background: var(--c); cursor: pointer; min-width: 0; min-height: 0; transition: background .06s; touch-action: none; }
.spad.lit { background: var(--cl); box-shadow: inset 0 0 14cqw rgba(255,255,255,.55); }
.shub {
  position: absolute; left: 50%; top: 50%; width: 38%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%;
  background: #0f1220; border: 1.4cqw solid #2a2f45; display: grid; place-items: center; color: #e8ecf8; text-align: center;
}
.shub .hn { font-size: 15cqw; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.shub .hb { font: inherit; font-size: 6cqw; font-weight: 700; color: #0f1220; background: #fde047; border: 0; border-radius: 3cqw; padding: 2.2cqw 4cqw; cursor: pointer; }
.shub.idle .hn { display: none; }
.shub:not(.idle) .hb { display: none; }

/* novos jogos */
.emo { display: block; font-size: 64px; line-height: 1; }
.gcard .emo { font-size: clamp(40px, 12vw, 56px); }
.emo.sil { filter: brightness(0); opacity: .85; }
.square { position: relative; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two .big { font-size: 18px; padding: 12px; }
.it.wrong { animation: shake .3s; }
.it.sz { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 16px; }
.it.sz.cnt { opacity: 1; }
.it.sz.cnt span { opacity: .45; }
.it.sz.cnt::after { position: static; font-size: 20px; min-width: 1.6em; height: 1.6em; }

/* perguntas e respostas */
.qbox { width: 100cqw; height: 100cqh; display: grid; place-items: center; text-align: center; font-size: min(52cqmin, 190px); line-height: 1; cursor: pointer; }
.qbox .cap { display: block; font-size: .2em; font-weight: 700; margin-top: .18em; line-height: 1.1; }
.qbox svg { width: min(78cqmin, 260px); height: auto; display: block; }
.qchoices { flex: none; display: grid; gap: 10px; min-height: 96px; }
.qc {
  font-size: 46px; font-weight: 700; color: var(--ink); background: var(--tile); border: 3px solid var(--tile-edge); border-bottom-width: 7px;
  border-radius: 24px; cursor: pointer; min-height: 92px; display: grid; place-items: center; padding: 4px; min-width: 0; line-height: 1;
}
.qc:active { transform: translateY(3px); }
.qc svg { width: 64px; height: 64px; display: block; }
.qc.right { background: #22c55e; color: #fff; border-color: transparent; }
.qc.wrong { opacity: .35; animation: shake .3s; }
.sil { display: block; filter: brightness(0); opacity: .85; }
.qc.right .sil { filter: none; opacity: 1; }

/* qual é diferente */
.dgrid {
  display: grid; width: min(100cqw, 100cqh); height: min(100cqw, 100cqh); gap: 6px;
  grid-template-columns: repeat(var(--n), minmax(0, 1fr)); grid-template-rows: repeat(var(--n), minmax(0, 1fr));
  font-size: calc(min(100cqw, 100cqh) / var(--n) * .66);
}
.dcell { background: var(--tile); border: 3px solid var(--tile-edge); border-radius: 18%; display: grid; place-items: center; cursor: pointer; padding: 0; font-size: inherit; line-height: 1; color: inherit; min-width: 0; min-height: 0; }
.dcell.right { background: var(--win); border-color: var(--accent); }
.dcell.wrong { opacity: .3; }

/* piano */
.keys { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; width: 100%; height: 100%; }
.key {
  border: 0; border-radius: 14px 14px 22px 22px; background: var(--c); cursor: pointer; color: #fff; font-weight: 700; font-size: 14px; min-width: 0; padding: 0 0 14px;
  display: flex; align-items: flex-end; justify-content: center; touch-action: none; box-shadow: inset 0 -12px 0 rgba(0,0,0,.18); text-shadow: 0 1px 2px rgba(0,0,0,.35);
}
.key.on { filter: brightness(1.25); transform: translateY(4px); }
.key.next { outline: 5px solid var(--ink); outline-offset: -5px; animation: blink .55s ease-in-out infinite alternate; }
@keyframes blink { to { filter: brightness(1.45); } }

/* ligar os pontos */
.dots { width: 100%; height: 100%; display: block; background: var(--paper); border-radius: 22px; border: 3px solid var(--tile-edge); }
.dots .hit { fill: transparent; cursor: pointer; }
.dots .dot { fill: var(--accent); stroke: #1d2b4a; stroke-width: .8; }
.dots .pt.dn .dot { fill: #1d2b4a; }
.dots .pt.next .dot { fill: #facc15; transform-box: fill-box; transform-origin: center; animation: pulse .6s ease-in-out infinite alternate; }
@keyframes pulse { to { transform: scale(1.5); } }
.dots text { font-family: var(--font); font-weight: 700; font-size: 5.6px; fill: #1d2b4a; pointer-events: none; -webkit-user-select: none; user-select: none; }
.dots .segs line { stroke: #1d2b4a; stroke-width: 1.4; stroke-linecap: round; }
.dots .fillpoly { opacity: 0; transition: opacity .5s; stroke: #1d2b4a; stroke-width: 1.3; stroke-linejoin: round; }
.dots.done .fillpoly { opacity: 1; }
.dots .decor { opacity: 0; transition: opacity .5s .2s; pointer-events: none; }
.dots.done .decor { opacity: 1; }
.dots .segs, .dots .pt { transition: opacity .4s; }
.dots.done .segs, .dots.done .pt { opacity: 0; }

/* sinuca e futebol */
.gfield { position: relative; height: min(100cqh, 160cqw); aspect-ratio: 5 / 8; border-radius: 22px; overflow: hidden; box-shadow: 0 0 0 3px var(--tile-edge); background: #1b9a50; }
.gfield canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
.confetti i { position: absolute; top: -20px; width: 12px; height: 18px; border-radius: 3px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
.gcard { position: relative; }
@media (prefers-reduced-motion: reduce) {
  .cell.pop svg, .cell.win svg { animation: none; }
  .confetti { display: none; }
  .mcard .inner { transition: none; }
}
</style>
</head>
<body>
<div id="app">
  <section id="hub" class="screen">
    <div class="hub-head"><h1>Cantinho dos Jogos</h1><button class="small-btn gear" id="btnCfg" type="button" aria-label="Configurações">⚙️</button></div>
    <div class="hub-grid" id="hubGrid"></div>
  </section>
  <section id="gmenu" class="screen" hidden></section>
  <section id="play" class="screen" hidden>
    <div class="topbar">
      <button class="small-btn" id="btnBack" type="button">&larr; Voltar</button>
      <div class="ptitle" id="ptitle"></div>
      <button class="small-btn snd" type="button"></button>
    </div>
    <div class="play-area" id="playArea"></div>
  </section>
  <section id="settings" class="screen" hidden></section>
</div>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  function rand(n) { return Math.floor(Math.random() * n); }
  function pick(a) { return a[rand(a.length)]; }
  var bags = {};
  /* sorteio sem repetir: só repete depois de passar por todos */
  function bagPick(key, arr) {
    var b = bags[key];
    if (!b || !b.q.length || b.len !== arr.length) {
      var q = shuffle(arr);
      if (b && b.last !== undefined && q.length > 1 && q[q.length - 1] === b.last) q.unshift(q.pop());
      b = bags[key] = { q: q, len: arr.length, last: b ? b.last : undefined };
    }
    var v = b.q.pop(); b.last = v; return v;
  }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = rand(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  /* ---------- ajustes salvos no aparelho ---------- */
  var KEY = 'cantinho.cfg';
  var cfg = { sound: true, voice: true, voiceName: '', rate: 0.95, sort: 'default' };
  try { var saved = JSON.parse(localStorage.getItem(KEY) || '{}'); Object.keys(cfg).forEach(function (k) { if (k in saved) cfg[k] = saved[k]; }); } catch (e) {}
  function saveCfg() { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {} }

  var gtoken = 0, cleanups = [], current = null;
  function later(fn, ms) { var T = gtoken; return setTimeout(function () { if (T === gtoken) fn(); }, ms); }

  /* ---------- sons ---------- */
  var ctx = null;
  function audio() {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
    return ctx;
  }
  function beep(freq, dur, type, delay) {
    if (!cfg.sound) return;
    try {
      var c = audio(), t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;

    }
    chipsFor('vSort', SORTS.map(function (x) { return [x[1], x[0]]; }), function (v) { return cfg.sort === v; }, function (v) { cfg.sort = v; saveCfg(); renderHub(); });
    chipsFor('vSnd', [['Ligado', true], ['Desligado', false]], function (v) { return cfg.sound === v; }, function (v) { cfg.sound = v; if (!v) stopSpeech(); saveCfg(); updateSnd(); });
    chipsFor('vOn', [['Ligada', true], ['Desligada', false]], function (v) { return cfg.voice === v; }, function (v) { cfg.voice = v; saveCfg(); });
    chipsFor('vRate', [['Devagar', 0.8], ['Normal', 0.95]], function (v) { return cfg.rate === v; }, function (v) { cfg.rate = v; saveCfg(); speak('Olá! Vamos brincar?'); });
    var sel = $('vSel'), auto = autoVoice(), tip = $('vTip');
    function fillSel() {
      loadVoices(); sel.innerHTML = '';
      var o0 = document.createElement('option'); o0.value = ''; o0.textContent = 'Automática' + (autoVoice() ? ' (' + autoVoice().name + ')' : ''); sel.appendChild(o0);
      ptVoices.slice().sort(function (a, b) { return voiceScore(b) - voiceScore(a); }).forEach(function (v) {
        var o = document.createElement('option'); o.value = v.name; o.textContent = v.name + ' · ' + normLang(v.lang); sel.appendChild(o);
      });
      sel.value = cfg.voiceName; if (sel.value !== cfg.voiceName) sel.value = '';
    }
    fillSel();
    if (synth && synth.addEventListener) { var h = function () { if (!$('settings').hidden) fillSel(); }; synth.addEventListener('voiceschanged', h); cleanups.push(function () { synth.removeEventListener('voiceschanged', h); }); }
    sel.addEventListener('change', function () { cfg.voiceName = sel.value; saveCfg(); speak('Olá! Eu sou a nova voz.'); });
    $('vTest').addEventListener('click', function () { speak('Olá! Vamos brincar de contar e achar os pares?'); });
    tip.textContent = !synth ? 'Este navegador não tem voz falada.' :
      !ptVoices.length ? 'Nenhuma voz em português encontrada. No Android, instale a voz do Google: Configurações › Sistema › Idiomas › Saída de texto para fala › Google › Instalar dados de voz › Português (Brasil). No iPhone: Ajustes › Acessibilidade › Conteúdo Falado › Vozes › Português.' :
      !auto ? 'Só encontrei vozes de Portugal. Instale a voz Português (Brasil) do aparelho para um sotaque brasileiro.' :
      'Se a voz ainda soar robótica, escolha outra na lista. As melhores costumam ter “Google”, “Natural” ou “Premium” no nome.';
    s.querySelector('[data-a="home"]').addEventListener('click', showHub);
    updateSnd();
  }
  $('btnCfg').addEventListener('click', showSettings);

  /* ---------- ordenar os jogos ---------- */
  var grid = $('hubGrid');
  var plays = {};
  try { plays = JSON.parse(localStorage.getItem('cantinho.plays') || '{}') || {}; } catch (e) { plays = {}; }
  function countPlay(g) { plays[g.id] = (plays[g.id] || 0) + 1; try { localStorage.setItem('cantinho.plays', JSON.stringify(plays)); } catch (e) {} }
  var SORTS = [['default', 'Padrão'], ['az', 'A–Z'], ['most', 'Mais jogados']];
  if (!SORTS.some(function (x) { return x[0] === cfg.sort; })) cfg.sort = 'default';
  function sortedGames() {
    var l = GAMES.map(function (g, i) { return { g: g, i: i }; });
    if (cfg.sort === 'az') l.sort(function (a, b) { return a.g.title.localeCompare(b.g.title, 'pt-BR') || a.i - b.i; });
    else if (cfg.sort === 'most') l.sort(function (a, b) { return (plays[b.g.id] || 0) - (plays[a.g.id] || 0) || a.i - b.i; });
    return l.map(function (x) { return x.g; });
  }
  function renderHub() {
    grid.innerHTML = '';
    sortedGames().forEach(function (g) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'gcard';
      b.innerHTML = g.icon + '<span>' + g.title + '</span>';
      b.addEventListener('click', function () { showMenu(g); }); grid.appendChild(b);
    });
    grid.scrollTop = 0;
  }
  renderHub();
  updateSnd(); show('hub');
  if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
})();
</script>
</body>
