<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9f5ff">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Cantinho dos Jogos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: cada tela ocupa a página inteira; a área de jogo tem tamanho fixo e nunca muda durante a partida. */
:root {
  --bg: #e9f5ff;
  --ink: #1d2b4a;
  --ink-soft: #55678a;
  --tile: #ffffff;
  --tile-edge: #cfe3f5;
  --star: #5b5ce6;
  --on-star: #ffffff;
  --ball: #12a9a0;
  --on-ball: #052e2b;
  --accent: #ff6b57;
  --accent-ink: #ffffff;
  --win: #fff2c2;
  --paper: #ffffff;
  --sky-a: #b9e3ff;
  --sky-b: #eaf8ff;
  --font: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14203a; --ink: #f1f6ff; --ink-soft: #a9b9d8; --tile: #22325a; --tile-edge: #2f4478;
    --star: #a3a4ff; --on-star: #14203a; --ball: #3fd6cb; --on-ball: #0b2a28; --accent: #ff7f6b; --accent-ink: #1b1020; --win: #3a4a1f;
    --paper: #f4f7ff; --sky-a: #1d3a6b; --sky-b: #14264a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14203a; --ink: #f1f6ff; --ink-soft: #a9b9d8; --tile: #22325a; --tile-edge: #2f4478;
  --star: #a3a4ff; --on-star: #14203a; --ball: #3fd6cb; --on-ball: #0b2a28; --accent: #ff7f6b; --accent-ink: #1b1020; --win: #3a4a1f;
  --paper: #f4f7ff; --sky-a: #1d3a6b; --sky-b: #14264a;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 18px;
  padding-block: 10px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none; overflow: hidden;
}
button { font-family: inherit; touch-action: manipulation; }
#app { height: 100%; max-width: 560px; margin: 0 auto; min-height: 0; }
.screen { height: 100%; display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }
.play-area { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }

/* barra superior */
.topbar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; flex: none; }
.ptitle { text-align: center; font-weight: 700; font-size: 20px; line-height: 1.05; min-width: 0; text-wrap: balance; }
.small-btn {
  font-weight: 600; font-size: 16px; color: var(--ink); background: var(--tile);
  border: 3px solid var(--tile-edge); border-radius: 16px; padding: 8px 14px; cursor: pointer; min-height: 46px;
}
.small-btn[aria-pressed="true"].on { border-color: var(--accent); }

/* central de jogos */
.hub-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex: none; }
.hub-btns { display: flex; gap: 8px; flex: none; }
h1 { font-size: clamp(28px, 7.4vw, 40px); line-height: 1.05; margin: 0; font-weight: 700; text-wrap: balance; }
.hub-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 1fr); gap: 12px; }
.gcard {
  background: var(--tile); border: 3px solid var(--tile-edge); border-bottom-width: 8px; border-radius: 28px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px;
  color: var(--ink); font-weight: 600; font-size: clamp(17px, 4.6vw, 22px); cursor: pointer; min-height: 0; min-width: 0;
  text-align: center; line-height: 1.1;
}
.gcard:active { transform: translateY(3px); border-bottom-width: 5px; }
.gcard svg { width: clamp(44px, 15vw, 78px); height: auto; max-height: 55%; }

/* menu de cada jogo */
.menu-body { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; -webkit-user-select: auto; user-select: auto; }
.menu-inner { margin: auto 0; display: flex; flex-direction: column; gap: 14px; padding: 4px 0; min-width: 0; }
.menu-inner.top { margin: 0; }
.menu-inner h2 { margin: 0; text-align: center; font-size: 34px; line-height: 1.05; }
.menu-inner .desc { margin: 0; text-align: center; color: var(--ink-soft); font-weight: 500; }
.menu-icon { display: grid; place-items: center; }
.menu-icon svg { width: 84px; height: 84px; }
.compact .menu-icon { display: none; }
.label { font-weight: 600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .08em; font-size: 14px; margin-bottom: -6px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  flex: 1 1 28%; font-weight: 600; font-size: 18px; color: var(--ink); background: var(--tile);
  border: 3px solid var(--tile-edge); border-radius: 18px; padding: 12px 6px; cursor: pointer; min-height: 52px;
}
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.big {
  font-weight: 600; font-size: 22px; color: var(--ink); background: var(--tile);
  border: 3px solid var(--tile-edge); border-bottom-width: 7px; border-radius: 26px; padding: 16px 18px;
  display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; text-align: center; width: 100%;
}
.big:active { transform: translateY(3px); border-bottom-width: 4px; }
.big small { display: block; font-size: 15px; font-weight: 400; color: var(--ink-soft); }
.big.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; border-bottom-color: rgba(0,0,0,.2); }
.big.primary small { color: inherit; opacity: .85; }
.actions { display: flex; flex-direction: column; gap: 12px; }
.sel {
  font: inherit; font-size: 17px; color: var(--ink); background: var(--tile); width: 100%;
  border: 3px solid var(--tile-edge); border-radius: 16px; padding: 12px; min-height: 52px;
}
.tip { margin: 0; color: var(--ink-soft); font-size: 15px; line-height: 1.35; font-weight: 400; }

/* busca de desenhos */
.extra { display: flex; flex-direction: column; gap: 8px; }
.extra .label, .extra .hint { margin: 0; }
.searchrow { display: flex; gap: 8px; }
.inp {
  flex: 1; min-width: 0; font: inherit; font-size: 18px; color: var(--ink); background: var(--tile);
  border: 3px solid var(--tile-edge); border-radius: 16px; padding: 10px 14px; min-height: 52px;
  -webkit-user-select: text; user-select: text;
}
.hint { min-height: 20px; color: var(--ink-soft); font-size: 15px; font-weight: 500; margin: -4px 0 -4px; }
.thumbs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; max-height: 32vh; overflow-y: auto; padding: 2px; }
.thumb {
  background: var(--tile); border: 3px solid var(--tile-edge); border-radius: 16px; padding: 4px 2px 5px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ink); font-size: 12px; font-weight: 600; min-width: 0;
}
.thumb svg { width: 100%; height: auto; display: block; border-radius: 10px; }
.thumb .reg { stroke-width: 2.2; }
.thumb[aria-pressed="true"] { border-color: var(--accent); background: var(--win); }
@media (max-width: 380px) { .thumbs { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* partes comuns dos jogos */
.status {
  flex: none; min-height: 56px; display: flex; align-items: center; justify-content: center; gap: 12px;
  font-size: 26px; font-weight: 700; text-align: center; line-height: 1.1;
}
.status svg { width: 42px; height: 42px; flex: none; }
.status.small { font-size: 22px; }
.stage { flex: 1; min-height: 0; container-type: size; display: grid; place-items: center; }
.square { width: min(100cqw, 100cqh); height: min(100cqw, 100cqh); }
.bottom { flex: none; min-height: 76px; display: flex; flex-direction: column; justify-content: center; }
.bottom[data-show="false"] .big { visibility: hidden; pointer-events: none; }
.focusable:focus-visible, button:focus-visible, .inp:focus-visible, .sel:focus-visible { outline: 4px solid var(--accent); outline-offset: 2px; }

/* placar */
.scores { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.score {
  background: var(--tile); border: 3px solid var(--tile-edge); border-radius: 20px; height: 56px;
  display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700; font-size: 28px;
  font-variant-numeric: tabular-nums;
}
.score svg { width: 32px; height: 32px; }
.score[data-on="true"] { border-color: var(--accent); }
.pbadge { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; font-weight: 700; flex: none; }
.pbadge.p1 { background: var(--star); color: var(--on-star); }
.pbadge.p2 { background: var(--ball); color: var(--on-ball); }

/* jogo da velha */
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; height: 100%; }
.cell {
  background: var(--tile); border: 3px solid var(--tile-edge); border-bottom-width: 7px; border-radius: 24px;
  padding: 12%; cursor: pointer; min-width: 0; min-height: 0; overflow: hidden; color: inherit; position: relative;
}
.cell:disabled { cursor: default; }
.cell:not(:disabled):active { transform: translateY(3px); }
.cell svg { position: absolute; inset: 12%; width: 76%; height: 76%; display: block; }
.cell.pop svg { animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
.cell.win { background: var(--win); border-color: var(--accent); }
.cell.win svg { animation: bounce .7s ease-in-out infinite alternate; }
@keyframes pop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes bounce { from { transform: scale(1) rotate(-6deg); } to { transform: scale(1.14) rotate(6deg); } }

/* memória */
.mgrid { display: grid; gap: 10px; width: 100cqw; height: 100cqh; }
.mcard { container-type: size; position: relative; background: none; border: 0; padding: 0; min-width: 0; min-height: 0; cursor: pointer; perspective: 700px; }
.mcard .inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .4s; }
.mcard.open .inner { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; display: grid; place-items: center; border-radius: 22px;
  -webkit-backface-visibility: hidden; backface-visibility: hidden; font-size: 50cqmin; font-weight: 700;
}
.face.back { background: var(--accent); color: var(--accent-ink); border: 3px solid transparent; border-bottom: 7px solid rgba(0,0,0,.2); }
.face.front { background: var(--tile); border: 3px solid var(--tile-edge); transform: rotateY(180deg); }
.mcard.ok .face.front { background: var(--win); border-color: var(--accent); }

/* balões */
.sky { position: relative; width: 100cqw; height: 100cqh; overflow: hidden; border-radius: 26px; background: linear-gradient(var(--sky-a), var(--sky-b)); border: 3px solid var(--tile-edge); }
.b-move { position: absolute; top: 0; pointer-events: none; animation: rise linear forwards; }
.b-move button {
  pointer-events: auto; display: block; width: 100%; height: calc(var(--w) * 1.22); border: 0; padding: 0; cursor: pointer;
  border-radius: 50% 50% 48% 48%; position: relative; transform-origin: 50% 100%;
  background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.6) 0 11%, transparent 12%), var(--c);
}
.b-move button::after { content: ""; position: absolute; left: 50%; top: 100%; width: 3px; height: 40px; background: rgba(0,0,0,.25); transform: translateX(-50%); }
.b-move button.pop { animation: boom .22s ease-out forwards; pointer-events: none; }
@keyframes rise { from { transform: translateY(var(--h)); } to { transform: translateY(calc(-1 * var(--bh))); } }
@keyframes boom { to { transform: scale(1.5); opacity: 0; } }

/* pintar */
.paintwrap { position: relative; width: 100%; height: 100%; border-radius: 22px; overflow: hidden; border: 3px solid var(--tile-edge); background: var(--paper); }
.paintwrap > * { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.paint .reg { fill: var(--paper); stroke: #1d2b4a; stroke-width: 1.2; stroke-linejoin: round; cursor: pointer; }
.paint .ln { fill: none; stroke: #1d2b4a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.paint.lines, .paint.lines * { pointer-events: none; }
.paint.lines .reg { fill: none; }
canvas.brush { touch-action: none; }
.m-fill canvas.brush { pointer-events: none; }
.m-brush canvas.brush { pointer-events: auto; cursor: crosshair; }
.tools { flex: none; display: grid; grid-template-columns: 1.4fr 1fr .95fr 1.25fr 1fr; gap: 6px; }
.tbtn {
  font-weight: 600; font-size: 13px; color: var(--ink); background: var(--tile); border: 3px solid var(--tile-edge);
  border-radius: 14px; min-height: 44px; padding: 2px; cursor: pointer; white-space: nowrap; min-width: 0;
}
.tbtn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.t-fill #sizeBtn { opacity: .35; pointer-events: none; }
.palette { flex: none; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.sw { height: 42px; border-radius: 14px; border: 3px solid var(--tile-edge); cursor: pointer; padding: 0; font-weight: 600; font-size: 12px; color: var(--ink); background: var(--tile); }
.sw[aria-pressed="true"] { outline: 4px solid var(--ink); outline-offset: 1px; }

/* contar */
.items { display: grid; width: 100cqw; height: 100cqh; }
.it { font-size: inherit; display: grid; place-items: center; background: none; border: 0; padding: 0; cursor: pointer; position: relative; line-height: 1; min-width: 0; min-height: 0; color: inherit; }
.it.cnt { opacity: .55; }
.it.cnt::after {
  content: attr(data-n); position: absolute; right: 6%; bottom: 6%; min-width: 1.5em; height: 1.5em; padding: 0 .25em; border-radius: 1em;
  background: var(--accent); color: var(--accent-ink); font-size: .3em; font-weight: 700; display: grid; place-items: center; font-family: var(--font);
}
.choices { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; min-height: 84px; }
.num { font-size: 40px; font-weight: 700; color: var(--ink); background: var(--tile); border: 3px solid var(--tile-edge); border-bottom-width: 7px; border-radius: 24px; cursor: pointer; }
.num:active { transform: translateY(3px); }
.num.right { background: #22c55e; color: #fff; border-color: transparent; }
.num.wrong { opacity: .35; animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* siga as cores (estilo Simon) */
.simon { position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #0f1220; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 3.2%; container-type: size; border: 6px solid #0f1220; box-shadow: 0 6px 0 rgba(0,0,0,.25); }
.spad { border: 0; padding: 0; background: var(--c); cursor: pointer; min-width: 0; min-height: 0; transition: background .06s; touch-action: none; }
.spad.lit { background: var(--cl); box-shadow: inset 0 0 14cqw rgba(255,255,255,.55); }
.shub {
  position: absolute; left: 50%; top: 50%; width: 38%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%;
  background: #0f1220; border: 1.4cqw solid #2a2f45; display: grid; place-items: center; color: #e8ecf8; text-align: center;
}
.shub .hn { font-size: 15cqw; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.shub .hb { font: inherit; font-size: 6cqw; font-weight: 700; color: #0f1220; background: #fde047; border: 0; border-radius: 3cqw; padding: 2.2cqw 4cqw; cursor: pointer; }
.shub.idle .hn { display: none; }
.shub:not(.idle) .hb { display: none; }

.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
.confetti i { position: absolute; top: -20px; width: 12px; height: 18px; border-radius: 3px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
@media (prefers-reduced-motion: reduce) {
  .cell.pop svg, .cell.win svg { animation: none; }
  .confetti { display: none; }
  .mcard .inner { transition: none; }
}
</style>
</head>
<body>
<div id="app">
  <section id="hub" class="screen">
    <div class="hub-head"><h1>Cantinho dos Jogos</h1><div class="hub-btns"><button class="small-btn" id="btnVoz" type="button">Voz</button><button class="small-btn snd" type="button"></button></div></div>
    <div class="hub-grid" id="hubGrid"></div>
  </section>
  <section id="gmenu" class="screen" hidden></section>
  <section id="play" class="screen" hidden>
    <div class="topbar">
      <button class="small-btn" id="btnBack" type="button">&larr; Voltar</button>
      <div class="ptitle" id="ptitle"></div>
      <button class="small-btn snd" type="button"></button>
    </div>
    <div class="play-area" id="playArea"></div>
  </section>
  <section id="settings" class="screen" hidden></section>
</div>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  function rand(n) { return Math.floor(Math.random() * n); }
  function pick(a) { return a[rand(a.length)]; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = rand(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  /* ---------- ajustes salvos no aparelho ---------- */
  var KEY = 'cantinho.cfg';
  var cfg = { sound: true, voice: true, voiceName: '', rate: 0.95 };
  try { var saved = JSON.parse(localStorage.getItem(KEY) || '{}'); Object.keys(cfg).forEach(function (k) { if (k in saved) cfg[k] = saved[k]; }); } catch (e) {}
  function saveCfg() { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {} }

  var gtoken = 0, cleanups = [], current = null;
  function later(fn, ms) { var T = gtoken; return setTimeout(function () { if (T === gtoken) fn(); }, ms); }

  /* ---------- sons ---------- */
  var ctx = null;
  function audio() {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
    return ctx;
  }
  function beep(freq, dur, type, delay) {
    if (!cfg.sound) return;
    try {
      var c = audio(), t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  function startTone(freq, vol) {
    if (!cfg.sound) return null;
    try {
      var c = audio(), o = c.createOscillator(), g = c.createGain();
      o.type = 'square'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, c.currentTime); g.gain.exponentialRampToValueAtTime(vol || 0.07, c.currentTime + 0.015);
      o.connect(g); g.connect(c.destination); o.start();
      return { o: o, g: g };
    } catch (e) { return null; }
  }
  function stopTone(t) {
    if (!t) return;
    try {
      var now = ctx.currentTime;
      t.g.gain.cancelScheduledValues(now); t.g.gain.setValueAtTime(Math.max(t.g.gain.value, 0.0002), now);
      t.g.gain.exponentialRampToValueAtTime(0.0001, now + 0.05); t.o.stop(now + 0.07);
    } catch (e) {}
  }
  function sfxWin() { [523, 659, 784, 1047].forEach(function (f, i) { beep(f, 0.22, 'triangle', i * 0.12); }); }
  function sfxBad() { beep(220, 0.25, 'sine'); }

  /* ---------- voz ---------- */
  var synth = window.speechSynthesis || null, uref = null, ptVoices = [];
  function normLang(l) { return (l || '').replace('_', '-'); }
  function loadVoices() {
    if (!synth) return;
    try { ptVoices = synth.getVoices().filter(function (v) { return /^pt/i.test(normLang(v.lang)); }); } catch (e) { ptVoices = []; }
  }
  if (synth) {
    loadVoices();
    if (synth.addEventListener) synth.addEventListener('voiceschanged', loadVoices); else synth.onvoiceschanged = loadVoices;
  }
  function voiceScore(v) {
    var n = (v.name || '').toLowerCase(), s = 0;
    if (/natural|neural|online/.test(n)) s += 60;
    if (/premium|enhanced|aprimorad|melhorad/.test(n)) s += 50;
    if (/siri/.test(n)) s += 45;
    if (/google/.test(n)) s += 40;
    if (/luciana|francisca|thalita|camila|vit[oó]ria|felipe|antonio|ant[oô]nio/.test(n)) s += 30;
    if (/compact|espeak|robot/.test(n)) s -= 40;
    if (v.localService === false) s += 5;
    return s;
  }
  function autoVoice() {
    var br = ptVoices.filter(function (v) { return normLang(v.lang).toLowerCase() === 'pt-br'; });
    if (!br.length) return null;
    return br.slice().sort(function (a, b) { return voiceScore(b) - voiceScore(a); })[0];
  }
  function chosenVoice() {
    if (cfg.voiceName) { for (var i = 0; i < ptVoices.length; i++) if (ptVoices[i].name === cfg.voiceName) return ptVoices[i]; }

  var ICON = { X: X, O: O };

  var LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  function winnerOf(b) {
    for (var i = 0; i < LINES.length; i++) { var l = LINES[i]; if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) return { p: b[l[0]], line: l }; }
    return null;
  }
  function empties(b) { var r = []; for (var i = 0; i < 9; i++) if (!b[i]) r.push(i); return r; }
  function minimax(b, player) {
    var w = winnerOf(b); if (w) return w.p === 'O' ? 10 : -10;
    var e = empties(b); if (!e.length) return 0;
    var best = player === 'O' ? -Infinity : Infinity;
    for (var k = 0; k < e.length; k++) {
      b[e[k]] = player; var s = minimax(b, player === 'O' ? 'X' : 'O'); b[e[k]] = null;
      best = player === 'O' ? Math.max(best, s) : Math.min(best, s);
    }
    return best;
  }
  function findWinning(b, p) {
    var e = empties(b);
    for (var i = 0; i < e.length; i++) { b[e[i]] = p; var w = winnerOf(b); b[e[i]] = null; if (w) return e[i]; }
    return -1;
  }
  function cpuChoice(board, level) {
    var b = board.slice(), e = empties(b);
    if (level === 'easy') return pick(e);
    if (level === 'mid') {
      var m = findWinning(b, 'O'); if (m < 0) m = findWinning(b, 'X');
      if (m >= 0 && Math.random() < 0.85) return m;
      return pick(e);
    }
    var bestScore = -Infinity, moves = [];
    for (var i = 0; i < e.length; i++) {
      b[e[i]] = 'O'; var s = minimax(b, 'X'); b[e[i]] = null;
      if (s > bestScore) { bestScore = s; moves = [e[i]]; } else if (s === bestScore) moves.push(e[i]);
    }
    return pick(moves);
  }

    function onCell(i) { if (st.over || st.board[i]) return; if (mode === 'cpu' && st.turn !== 'X') return; place(i); }

  /* ---------- MEMÓRIA (1 ou 2 jogadores) ---------- */
  var BICHOS = [['🐶', 'cachorro'], ['🐱', 'gato'], ['🐸', 'sapo'], ['🐵', 'macaco'], ['🐰', 'coelho'], ['🦁', 'leão'],
                ['🐷', 'porquinho'], ['🐻', 'urso'], ['🐼', 'panda'], ['🐮', 'vaquinha'], ['🐯', 'tigre'], ['🦊', 'raposa']];
  function memoria(area, o, mode, api) {
    var pairs = o.pairs, players = o.players;
    var chosen = shuffle(BICHOS).slice(0, pairs), deck = shuffle(chosen.concat(chosen));
    var cols = pairs === 6 ? 3 : 2, rows = deck.length / cols;
    area.innerHTML = (players === 2 ? scoresHTML() : '') + '<div class="status small" aria-live="polite"></div><div class="stage"><div class="mgrid"></div></div>' +
      '<div class="bottom" data-show="false"><button class="big primary" type="button">Jogar de novo</button></div>';
    var statusEl = area.querySelector('.status'), grid = area.querySelector('.mgrid'), bottom = area.querySelector('.bottom');
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
    grid.style.gridTemplateRows = 'repeat(' + rows + ', minmax(0, 1fr))';
    var open = [], lock = false, moves = 0, found = 0, els = [], turn = 0, scores = [0, 0], over = false;
    function info() {
      if (players === 2) { statusEl.textContent = over ? statusEl.textContent : 'Vez do jogador ' + (turn + 1); paintScores(area, scores, turn, over); }
      else statusEl.innerHTML = 'Jogadas: ' + moves + ' &nbsp;·&nbsp; Pares: ' + found + '/' + pairs;
    }
    deck.forEach(function (e, i) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'mcard';
      b.setAttribute('aria-label', 'Carta ' + (i + 1));
      b.innerHTML = '<div class="inner"><div class="face back">?</div><div class="face front">' + e[0] + '</div></div>';
      b.addEventListener('click', function () { flip(i); });
      grid.appendChild(b); els.push(b);
    });
    function finish() {
      over = true; sfxWin(); confetti(); bottom.dataset.show = 'true';
      var txt = players === 2 ? result2(scores) : 'Parabéns! Achou todos!';
      statusEl.textContent = txt; speak(txt); info();
    }
    function flip(i) {
      if (lock || over || els[i].classList.contains('open')) return;
      els[i].classList.add('open'); beep(520, 0.1, 'triangle'); speak(deck[i][1]); open.push(i);
      if (open.length < 2) return;
      moves++; lock = true; var a = open[0], b = open[1]; open = [];
      if (deck[a][0] === deck[b][0]) {
        later(function () {
          els[a].classList.add('ok'); els[b].classList.add('ok'); found++; if (players === 2) scores[turn]++;
          lock = false; beep(784, 0.18, 'triangle');
          if (found === pairs) { finish(); return; }
          info(); speak('Achou! ' + deck[a][1] + '!');
        }, 450);
      } else {

          els[a].classList.remove('open'); els[b].classList.remove('open'); lock = false;
          if (players === 2) { turn = 1 - turn; speak('Vez do jogador ' + (turn + 1)); }
          info();
        }, 1000);
      }
    }
    bottom.querySelector('button').addEventListener('click', api.restart);
    info();
    if (players === 2) speak('Vez do jogador 1');
  }

      phase = 'show'; pos = 0; setHub(false); refresh();
      say(who() + 'olhe com atenção', players === 2 ? 'Jogador ' + (turn + 1) + ', olhe com atenção' : 'Olhe com atenção');
      var t = stepMs(), start = 1300;
      seq.forEach(function (p, i) { later(function () { flash(p, t * 0.7); }, start + i * t); });
      later(function () { phase = 'input'; pos = 0; say(who() + 'sua vez!', players === 2 ? 'Jogador ' + (turn + 1) + ', sua vez!' : 'Sua vez!'); }, start + seq.length * t);
    }
    function begin() {
      seq = [rand(4)]; scores = [0, 0]; turn = 0; setHub(false); show();
    }
    function buzz() {
      for (var i = 0; i < 4; i++) pads[i].classList.add('lit');
      var t = startTone(110, 0.09); setTimeout(function () { stopTone(t); for (var i = 0; i < 4; i++) pads[i].classList.remove('lit'); }, 650);
    }
    function endGame(txt) {
      phase = 'idle'; refresh(); say(txt); sfxWin(); confetti();
      later(function () { setHub(true); hub.querySelector('.hb').textContent = 'De novo'; }, 700);
    }
    /* fim de uma tentativa (acertou ou errou) */
    function attemptDone(okay) {
      phase = 'wait';
      if (players === 1) {
        if (okay) {
          if (seq.length >= target) { later(function () { endGame('Você conseguiu!'); }, 500); return; }
          say('Muito bem!'); later(function () { seq.push(rand(4)); show(); }, 1100);
        } else { say('Quase! Vamos de novo'); later(show, 1500); }
        return;
      }
      if (okay) { scores[turn]++; say('Muito bem!'); } else say('Quase!');
      refresh();
      if (turn === 0) { later(function () { turn = 1; show(); }, 1300); return; }
      if (seq.length >= target) { later(function () { endGame(result2(scores)); }, 900); return; }
      later(function () { seq.push(rand(4)); turn = 0; show(); }, 1300);
    }
    function press(i) {
      if (phase !== 'input') return;
      lightOn(i);
      if (i === seq[pos]) {
        pos++;
        if (pos === seq.length) { phase = 'wait'; later(function () { attemptDone(true); }, 350); }
      } else {
        lightOff(i); phase = 'wait'; later(function () { buzz(); attemptDone(false); }, 80);
      }
    }
    pads.forEach(function (b, i) {
      b.addEventListener('pointerdown', function (e) { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (_) {} press(i); });
      ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (ev) { b.addEventListener(ev, function () { lightOff(i); }); });
      b.addEventListener('click', function (e) { if (e.detail === 0) { press(i); setTimeout(function () { lightOff(i); }, 300); } });
    });
    hub.querySelector('.hb').addEventListener('click', begin);
    setHub(true); refresh();
    say(players === 2 ? 'Toque em Iniciar. Dois jogadores!' : 'Toque em Iniciar', false);
  }

  /* ---------- catálogo, menus e navegação ---------- */
  function players() { return { key: 'players', label: 'Jogadores', options: [{ label: '1 jogador', value: 1 }, { label: '2 jogadores', value: 2 }] }; }
  var GAMES = [
    { id: 'velha', title: 'Jogo da Velha', desc: 'Ligue três em linha', run: velha,
      groups: [{ key: 'level', label: 'Nível do computador', options: [{ label: 'Fácil', value: 'easy' }, { label: 'Médio', value: 'mid' }, { label: 'Difícil', value: 'hard' }] }],
      actions: [{ label: 'Jogar com o computador', small: 'Você é o X', mode: 'cpu', primary: true }, { label: 'Jogar com outra pessoa', small: 'X e bola, um de cada vez', mode: 'pvp' }],
      icon: '<svg viewBox="0 0 64 64"><path d="M22 8v48M42 8v48M8 22h48M8 42h48" stroke="var(--ink-soft)" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M11 11l8 8M19 11l-8 8" stroke="var(--star)" stroke-width="4" stroke-linecap="round"/><circle cx="32" cy="32" r="5" fill="none" stroke="var(--ball)" stroke-width="4"/><path d="M45 45l8 8M53 45l-8 8" stroke="var(--star)" stroke-width="4" stroke-linecap="round"/></svg>' },
    { id: 'memoria', title: 'Memória', desc: 'Ache os pares de bichinhos', run: memoria,
      groups: [{ key: 'pairs', label: 'Quantos pares', options: [{ label: '3 pares', value: 3 }, { label: '4 pares', value: 4 }, { label: '6 pares', value: 6 }] }, players()],
      actions: [{ label: 'Jogar', mode: 'play', primary: true }],
      icon: '<svg viewBox="0 0 64 64"><rect x="6" y="12" width="24" height="36" rx="6" fill="var(--accent)"/><rect x="34" y="16" width="24" height="36" rx="6" fill="var(--tile)" stroke="var(--ball)" stroke-width="4"/><text x="18" y="39" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" font-family="inherit">?</text><circle cx="46" cy="34" r="7" fill="#ffb800"/></svg>' },
    { id: 'baloes', title: 'Balões', desc: 'Toque nos balões para estourar', run: baloes,
      groups: [{ key: 'speed', label: 'Velocidade', options: [{ label: 'Calmo', value: 'calm' }, { label: 'Normal', value: 'normal' }] }],
      actions: [{ label: 'Jogar', mode: 'play', primary: true }],
      icon: '<svg viewBox="0 0 64 64"><ellipse cx="24" cy="24" rx="14" ry="17" fill="var(--accent)"/><ellipse cx="42" cy="28" rx="12" ry="15" fill="var(--ball)"/><path d="M24 41L28 60M42 43L38 60" stroke="var(--ink-soft)" stroke-width="2" fill="none"/></svg>' },
    { id: 'pintar', title: 'Pintar', desc: '', run: pintar, compact: true, extra: paintPicker, subject: 'casa',
      extraOpts: function (g) { return { subject: g.subject }; },
      groups: [{ key: 'how', label: 'Como pintar', options: [{ label: 'Preencher (toque)', value: 'fill' }, { label: 'Pincel (dedo)', value: 'brush' }] }],
      actions: [{ label: 'Pintar', mode: 'play', primary: true }],
      icon: '<svg viewBox="0 0 64 64"><path d="M32 6C16 6 6 18 6 30c0 12 10 22 22 22 6 0 6-5 3-8-3-4 0-8 5-8h8c8 0 14-5 14-12C58 14 46 6 32 6z" fill="var(--tile)" stroke="var(--ink-soft)" stroke-width="3"/><circle cx="20" cy="26" r="5" fill="#ef4444"/><circle cx="32" cy="18" r="5" fill="#facc15"/><circle cx="45" cy="24" r="5" fill="#22c55e"/><circle cx="18" cy="40" r="5" fill="#3b82f6"/></svg>' },
    { id: 'contar', title: 'Contar', desc: 'Toque nos objetos para contar e escolha o número', run: contar,
      groups: [{ key: 'max', label: 'Até quanto', options: [{ label: 'Até 5', value: 5 }, { label: 'Até 10', value: 10 }, { label: 'Até 20', value: 20 }, { label: 'Até 30', value: 30 }] }],
      actions: [{ label: 'Jogar', mode: 'play', primary: true }],
      icon: '<svg viewBox="0 0 64 64"><text x="32" y="44" text-anchor="middle" font-size="32" font-weight="700" fill="var(--accent)" font-family="inherit">123</text></svg>' },
    { id: 'sequencia', title: 'Siga as Cores', desc: 'Veja a sequência e repita', run: simon,
      groups: [{ key: 'len', label: 'Tamanho', options: [{ label: 'Curto (3)', value: 3 }, { label: 'Médio (5)', value: 5 }, { label: 'Longo (8)', value: 8 }, { label: 'Mestre (14)', value: 14 }] }, players()],
      actions: [{ label: 'Jogar', mode: 'play', primary: true }],
      icon: '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#0f1220"/><path d="M32 32V6A26 26 0 0 0 6 32z" fill="#15803d"/><path d="M32 32H58A26 26 0 0 0 32 6z" fill="#b91c1c"/><path d="M32 32H6A26 26 0 0 0 32 58z" fill="#a16207"/><path d="M32 32V58A26 26 0 0 0 58 32z" fill="#1d4ed8"/><circle cx="32" cy="32" r="9" fill="#0f1220"/></svg>' }
  ];
  GAMES.forEach(function (g) { g.groups.forEach(function (gr) { gr.sel = 0; }); });

  var SCREENS = ['hub', 'gmenu', 'play', 'settings'];
  function show(id) { SCREENS.forEach(function (s) { $(s).hidden = s !== id; }); }
  function stopGame() {
    gtoken++; cleanups.forEach(function (f) { try { f(); } catch (e) {} }); cleanups = [];
    stopSpeech(); $('confetti').innerHTML = ''; $('playArea').innerHTML = '';
  }
  function showHub() { stopGame(); current = null; show('hub'); }
  function showMenu(g) {
    stopGame(); current = g; show('gmenu');
    var m = $('gmenu');
    m.innerHTML = '<div class="topbar"><button class="small-btn" data-a="home" type="button">&larr; Jogos</button><div></div><button class="small-btn snd" type="button"></button></div>' +
      '<div class="menu-body' + (g.compact ? ' compact' : '') + '"><div class="menu-inner"><div class="menu-icon">' + g.icon + '</div><h2>' + g.title + '</h2>' +
      (g.desc ? '<p class="desc">' + g.desc + '</p>' : '') + (g.extra ? '<div class="extra"></div>' : '') + '<div class="groups"></div><div class="actions"></div></div></div>';
    if (g.extra) g.extra(m.querySelector('.extra'), g);
    var groups = m.querySelector('.groups'); groups.style.cssText = 'display:flex;flex-direction:column;gap:14px';
    g.groups.forEach(function (gr) {
      var lab = document.createElement('div'); lab.className = 'label'; lab.textContent = gr.label;
      var chips = document.createElement('div'); chips.className = 'chips';
      gr.options.forEach(function (op, i) {
        var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = op.label; b.setAttribute('aria-pressed', String(i === gr.sel));
        b.addEventListener('click', function () { gr.sel = i; chips.querySelectorAll('.chip').forEach(function (c, j) { c.setAttribute('aria-pressed', String(j === i)); }); });
        chips.appendChild(b);
      });
      groups.appendChild(lab); groups.appendChild(chips);
    });
    var acts = m.querySelector('.actions');
    g.actions.forEach(function (a) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'big' + (a.primary ? ' primary' : '');
      b.innerHTML = '<span>' + a.label + (a.small ? '<small>' + a.small + '</small>' : '') + '</span>';
      b.addEventListener('click', function () { startGame(g, a.mode); }); acts.appendChild(b);
    });
    m.querySelector('[data-a="home"]').addEventListener('click', showHub);
    m.querySelector('.snd').addEventListener('click', function () { cfg.sound = !cfg.sound; if (!cfg.sound) stopSpeech(); saveCfg(); updateSnd(); });
    updateSnd();
  }
  function startGame(g, mode) {
    stopGame(); current = g; show('play'); $('ptitle').textContent = g.title;
    var opts = {}; g.groups.forEach(function (gr) { opts[gr.key] = gr.options[gr.sel].value; });
    if (g.extraOpts) { var x = g.extraOpts(g); for (var k in x) opts[k] = x[k]; }
    var api = { restart: function () { startGame(g, mode); }, onStop: function (f) { cleanups.push(f); } };
    g.run($('playArea'), opts, mode, api);
  }
  $('btnBack').addEventListener('click', function () { if (current) showMenu(current); else showHub(); });

  /* ---------- tela de voz ---------- */
  function showSettings() {
    stopGame(); show('settings'); loadVoices();
    var s = $('settings');
    s.innerHTML = '<div class="topbar"><button class="small-btn" data-a="home" type="button">&larr; Jogos</button><div class="ptitle">Voz</div><button class="small-btn snd" type="button"></button></div>' +
      '<div class="menu-body"><div class="menu-inner top">' +
      '<div class="label">Voz dos jogos</div><div class="chips" id="vOn"></div>' +
      '<div class="label">Qual voz</div><select class="sel" id="vSel" aria-label="Qual voz"></select>' +
      '<div class="label">Velocidade</div><div class="chips" id="vRate"></div>' +
      '<button class="big primary" id="vTest" type="button">Testar a voz</button>' +
      '<p class="tip" id="vTip"></p></div></div>';
    function chipsFor(id, opts, isOn, onPick) {
      var box = $(id); box.innerHTML = '';
      opts.forEach(function (op) {
        var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = op[0]; b.setAttribute('aria-pressed', String(isOn(op[1])));
        b.addEventListener('click', function () { onPick(op[1]); box.querySelectorAll('.chip').forEach(function (c) { c.setAttribute('aria-pressed', String(c === b)); }); });
        box.appendChild(b);
      });
    }
    chipsFor('vOn', [['Ligada', true], ['Desligada', false]], function (v) { return cfg.voice === v; }, function (v) { cfg.voice = v; saveCfg(); });
    chipsFor('vRate', [['Devagar', 0.8], ['Normal', 0.95]], function (v) { return cfg.rate === v; }, function (v) { cfg.rate = v; saveCfg(); speak('Olá! Vamos brincar?'); });
    var sel = $('vSel'), auto = autoVoice(), tip = $('vTip');
    function fillSel() {
      loadVoices(); sel.innerHTML = '';
      var o0 = document.createElement('option'); o0.value = ''; o0.textContent = 'Automática' + (autoVoice() ? ' (' + autoVoice().name + ')' : ''); sel.appendChild(o0);
      ptVoices.slice().sort(function (a, b) { return voiceScore(b) - voiceScore(a); }).forEach(function (v) {
        var o = document.createElement('option'); o.value = v.name; o.textContent = v.name + ' · ' + normLang(v.lang); sel.appendChild(o);
      });
      sel.value = cfg.voiceName; if (sel.value !== cfg.voiceName) sel.value = '';
    }
    fillSel();
    if (synth && synth.addEventListener) { var h = function () { if (!$('settings').hidden) fillSel(); }; synth.addEventListener('voiceschanged', h); cleanups.push(function () { synth.removeEventListener('voiceschanged', h); }); }
    sel.addEventListener('change', function () { cfg.voiceName = sel.value; saveCfg(); speak('Olá! Eu sou a nova voz.'); });
    $('vTest').addEventListener('click', function () { speak('Olá! Vamos brincar de contar, pintar e achar os pares?'); });
    tip.textContent = !synth ? 'Este navegador não tem voz falada.' :
      !ptVoices.length ? 'Nenhuma voz em português encontrada. No Android, instale a voz do Google: Configurações › Sistema › Idiomas › Saída de texto para fala › Google › Instalar dados de voz › Português (Brasil). No iPhone: Ajustes › Acessibilidade › Conteúdo Falado › Vozes › Português.' :
      !auto ? 'Só encontrei vozes de Portugal. Instale a voz Português (Brasil) do aparelho para um sotaque brasileiro.' :
      'Se a voz ainda soar robótica, escolha outra na lista. As melhores costumam ter “Google”, “Natural” ou “Premium” no nome.';
    s.querySelector('[data-a="home"]').addEventListener('click', showHub);
    s.querySelector('.snd').addEventListener('click', function () { cfg.sound = !cfg.sound; if (!cfg.sound) stopSpeech(); saveCfg(); updateSnd(); });
    updateSnd();
  }
  $('btnVoz').addEventListener('click', showSettings);

  var grid = $('hubGrid');
  GAMES.forEach(function (g) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'gcard';
    b.innerHTML = g.icon + '<span>' + g.title + '</span>';
    b.addEventListener('click', function () { showMenu(g); }); grid.appendChild(b);
  });
  updateSnd(); show('hub');
  if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
})();
</script>
